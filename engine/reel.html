<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Reel de cocina</title>
<style>
  @font-face { font-family: "Luckiest"; src: url("fonts/LuckiestGuy.ttf"); }
  @font-face { font-family: "Lilita"; src: url("fonts/LilitaOne.ttf"); }
  @font-face { font-family: "Baloo"; src: url("fonts/Baloo2-ExtraBold.ttf"); }
  html, body { margin: 0; background: #111; }
  #stage { width: 1080px; height: 1920px; position: relative; overflow: hidden; }
  #stage svg { display: block; }
  /* modo vista previa: escala para que quepa en pantalla */
  body.preview { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 12px; }
  body.preview #wrap { width: 405px; height: 720px; overflow: hidden; border-radius: 18px; }
  body.preview #stage { transform: scale(0.375); transform-origin: 0 0; }
  #controls { display: none; color: #eee; font: 14px sans-serif; gap: 8px; align-items: center; }
  body.preview #controls { display: flex; }
  #controls input[type=range] { width: 300px; }
</style>
</head>
<body>
<div id="wrap"><div id="stage"></div></div>
<div id="controls">
  <button id="play">▶︎ / ❚❚</button>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <span id="time">0.0s</span>
</div>
<script>
  // Carga la receta: reel.html?r=panqueques-platano  -> ../recetas/panqueques-platano.js
  const params = new URLSearchParams(location.search);
  const nombre = params.get("r") || "panqueques-platano";
  if (!params.has("render")) document.body.classList.add("preview");
  const s = document.createElement("script");
  s.src = "../recetas/" + nombre + ".js";
  s.onload = () => {
    const e = document.createElement("script");
    e.src = "reel.js";
    document.body.appendChild(e);
  };
  document.body.appendChild(s);
</script>
</body>
</html>
